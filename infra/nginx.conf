worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen __CONTAINER_PORT__;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-transform" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location ~ /\. { deny all; }
        location ~* ^/(memory|src|infra|local-tests|tests|docs)(/|$) { return 404; }
        location ~* (^|/)(CREDENTIALS|PROJECT-DOSSIER|AGENTS|CLAUDE)\.md$ { return 404; }
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }
        location /images/ {
            expires 1h;
            try_files $uri =404;
        }
        location /videos/ {
            expires 1h;
            try_files $uri =404;
        }
        location = /workspace {
            expires -1;
            try_files /index.html =404;
        }
        location / {
            expires -1;
            try_files $uri $uri/ =404;
        }
    }
}
