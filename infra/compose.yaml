name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}
services:
  web:
    image: ${STATIC_IMAGE:?Set a verified pinned image digest}
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    user: "101:101"
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    ports:
      - "127.0.0.1:${LOOPBACK_PORT:?Set LOOPBACK_PORT}:${CONTAINER_PORT:?Set CONTAINER_PORT}"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${CONTAINER_PORT:?Set CONTAINER_PORT}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
networks:
  default:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:?Set an inventoried nonoverlapping subnet}
