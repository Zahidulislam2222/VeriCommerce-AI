worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    set_real_ip_from __TRUSTED_GATEWAY_IP__;
    real_ip_header X-VeriCommerce-Edge-IP;
    server {
        listen __WEB_PORT__;
        root /usr/share/nginx/html;
        index index.html;
        error_page 404 /404.html;
        location = /404.html { internal; }
        client_max_body_size __MAX_BODY_BYTES__;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control no-transform always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        location /api/ {
            proxy_pass http://api:__API_PORT__;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout __PROXY_CONNECT_TIMEOUT__s;
            proxy_read_timeout __PROXY_READ_TIMEOUT__s;
            proxy_send_timeout __PROXY_READ_TIMEOUT__s;
            proxy_hide_header X-Powered-By;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }
        location ~ /\. { deny all; }
        location ~* ^/(memory|src|backend|infra|local-tests|tests|docs)(/|$) { return 404; }
        location ~* (^|/)(CREDENTIALS|PROJECT-DOSSIER|AGENTS|CLAUDE)\.md$ { return 404; }
        location /assets/ { expires 1y; try_files $uri =404; }
        location /images/ { expires 1h; try_files $uri =404; }
        location /videos/ { expires 1h; try_files $uri =404; }
        location = /workspace { expires -1; try_files /index.html =404; }
        location = /engine { expires -1; try_files /index.html =404; }
        location = /platform { expires -1; try_files /index.html =404; }
        location = /pricing { expires -1; try_files /index.html =404; }
        location = /about { expires -1; try_files /index.html =404; }
        location = /contact { expires -1; try_files /index.html =404; }
        location = /docs { expires -1; try_files /index.html =404; }
        location = /changelog { expires -1; try_files /index.html =404; }
        location = /security { expires -1; try_files /index.html =404; }
        location = /legal { expires -1; try_files /index.html =404; }
        location = /privacy { expires -1; try_files /index.html =404; }
        location = /terms { expires -1; try_files /index.html =404; }
        location = /cookies { expires -1; try_files /index.html =404; }
        location = /accessibility { expires -1; try_files /index.html =404; }
        location = /legal/us { expires -1; try_files /index.html =404; }
        location = /legal/eu { expires -1; try_files /index.html =404; }
        location / { expires -1; try_files $uri $uri/ =404; }
    }
}
